<!DOCTYPE html>
<html lang="en" data-lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <!-- the status bar follows the theme, so an installed app does not show a
       white bar above a dark screen -->
  <meta name="theme-color" content="#f2f3f6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0a0d12" media="(prefers-color-scheme: dark)" />
  <meta name="description" content="Al Fursan Equestrian Academy — rider portal and class management" />
  <title>Al Fursan Equestrian Academy</title>

  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="assets/favicon-16.png" sizes="16x16" type="image/png" />
  <link rel="icon" href="assets/icon-192.png" sizes="192x192" type="image/png" />
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Al Fursan" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Anek+Bangla:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>

  <div class="shell">
    <nav id="nav" class="nav" hidden aria-label="Sections"></nav>
    <main id="app" class="app"></main>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="modal" class="modal-wrap" hidden>
    <div class="modal-backdrop" data-close></div>
    <div class="modal" role="dialog" aria-modal="true"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/store.js"></script>
  <script src="js/demo.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/guide.js"></script>
  <script src="js/student.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/guest.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
